[project]
name = "oria"
version = "0.1.0"
description = "Assistant IA sport — ossature résiliente"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "openai>=1.50",
    "tenacity>=9",
    "structlog>=24",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "time-machine>=2.15",
    "ruff>=0.7",
    "mypy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oria"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant un accès réseau à l'API Football (coûtent du budget)",
    "live: tests nécessitant des matchs en direct (P7, lancer un soir de matchs)",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
